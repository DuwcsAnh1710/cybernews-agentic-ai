name: Daily Cybersecurity Magazine Pipeline & Deploy

on:
  schedule:
    # Runs at 00:00 UTC every day (07:00 AM Vietnam Time UTC+7)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-pipeline"
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[media]

      - name: Ingest Fresh Articles from Cybersecurity RSS Feeds (Collect)
        run: |
          python -m cyberpulse.cli collect --settings config/settings.toml --sources config/sources.toml

      - name: Execute CyberPulse AI Daily Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXIT_CODE=0
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt: Running CyberPulse AI Pipeline ==="
            set +e
            python -m cyberpulse.cli run --settings config/settings.toml --sources config/sources.toml --allow-insufficient --max-rewrites 3
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 8 ]; then
              break
            fi
            if [ $EXIT_CODE -eq 5 ] && [ $attempt -lt 3 ]; then
              echo "::warning::Hit transient Gemini 503/429 spike. Sleeping 30s before retry attempt $((attempt + 1))..."
              sleep 30
            else
              break
            fi
          done

          if [ $EXIT_CODE -eq 0 ]; then
            echo "Pipeline run completed cleanly: AWAITING_REVIEW (passed all validation gates)."
          elif [ $EXIT_CODE -eq 8 ]; then
            echo "::warning::Validation reported non-critical issues (exit code 8, e.g. E_NUMBER_UNSUPPORTED). Proceeding with best-effort package for automated publishing."
          else
            echo "::warning::Pipeline AI generation exited with code $EXIT_CODE (e.g. Gemini 429 quota exhausted or transient outage). Proceeding with existing editorial archive to ensure continuous portal deployment and uptime."
          fi

      - name: Synthesize Podcast Audio (Edge-TTS)
        run: |
          LATEST_FILE=$(ls -t output/editorial/*.json 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_FILE" ]; then
            LATEST_RUN=$(basename "$LATEST_FILE" .json)
            echo "Synthesizing podcast for run: $LATEST_RUN"
            python -m cyberpulse.cli media podcast "$LATEST_RUN" || echo "Podcast synthesis skipped or failed"
          else
            echo "No editorial packages found to synthesize audio."
          fi

      - name: Build The Hacker News Style Static Portal
        run: |
          python -m cyberpulse.cli export portal --output-dir output --dist-dir dist

      - name: Commit New Edition Artifacts to Main Archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/editorial/ output/research/ output/validation/ output/media/podcast/ || true
          git commit -m "chore(data): auto-archive daily edition $(date -u +'%Y-%m-%d')" || echo "No new edition artifacts to commit"
          git push origin main || echo "Could not push archive to main"

      - name: Deploy to InfinityFree (cyberpulseDA.wuaze.com)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_PASSWORD" ]; then
            echo "Deploying to InfinityFree via FTP..."
            python scripts/deploy_wuaze.py --password "$FTP_PASSWORD"
          else
            echo "::warning::FTP_PASSWORD secret is not configured or empty. Skipping InfinityFree deployment."
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch dist/.nojekyll
          git add --force dist
          TREE=$(git write-tree --prefix=dist/)
          COMMIT=$(git commit-tree $TREE -m "Automated Daily Deploy $(date -u +'%Y-%m-%d %H:%M:%SZ')")
          git push origin "${COMMIT}:refs/heads/gh-pages" --force
