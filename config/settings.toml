project_name = "CyberPulse AI"
topics = [
  "cybersecurity",
  "data breach",
  "vulnerability",
  "ransomware",
  "AI security",
]
items_per_run = 5
lookback_hours = 48
output_language = "vi"
log_level = "INFO"

[paths]
data_dir = "data"
output_dir = "output"
log_dir = "logs"

[fetch]
timeout_sec = 15
max_bytes = 5000000
retries = 1
user_agent = "CyberPulseAI/0.1 (+https://github.com/DuwcsAnh1710/cybernews-agentic-ai)"

[normalize]
title_similarity = 0.9
summary_max_chars = 1000
future_tolerance_minutes = 60

[llm]
provider = "gemini"
# gemini-3.8-flash and gemini-3.7-flash returned 504 DEADLINE_EXCEEDED on every call
# from this free-tier key (2026-10-29); gemini-3.6-flash answers in ~2 s.
model = "gemini-3.6-flash"
thinking_level = "low"
max_output_tokens = 8192
timeout_sec = 60
max_retries = 2
schema_retries = 1
backoff_base_sec = 2.0

[research]
max_candidates = 30
shortlist_extra = 5
max_per_source = 2
summary_chars_in_prompt = 300

[editorial]
podcast_target_words = 600
video_max_total_sec = 90
caption_platforms = ["facebook", "youtube", "tiktok"]
podcast_speakers = ["Minh", "Lan"]

[validator]
llm_review = true
podcast_word_tolerance = 0.2
section_words_min = 60
section_words_max = 120
term_allowlist = ["Trung"]

